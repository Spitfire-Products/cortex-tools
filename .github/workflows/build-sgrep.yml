name: build-sgrep
# Manual only. Builds context-dot-dev/sgrep at a pinned ref for x86_64 glibc + static musl (and, in a second job, macOS arm64 + x86_64 —
# the upstream macOS tarball is cut from the v0.3.0 TAG and lacks --explain/--stdin that main gained after it; both report 0.3.0)
# and publishes a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      upstream_ref: { description: "upstream commit or tag (default: tools/sgrep/PIN)", required: false, default: "" }
      version:      { description: "release version, e.g. 0.3.0", required: true, default: "0.3.0" }
      targets:      { description: "linux | macos | both | macos-x64 (macos alone leaves the published Linux assets and their pinned checksums untouched; macos-x64 builds ONLY the Intel macOS binary and leaves every published asset untouched)", required: false, default: "both" }
permissions: { contents: write }
jobs:
  build:
    if: ${{ !startsWith(github.event.inputs.targets, 'macos') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pin
        run: |
          REF="${{ github.event.inputs.upstream_ref }}"; [ -n "$REF" ] || REF="$(cat tools/sgrep/PIN)"; echo "REF=$REF" >> "$GITHUB_ENV"
          echo "V=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
      - name: Toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools ripgrep >/dev/null
          rustup target add x86_64-unknown-linux-musl
      - name: Fetch upstream at the pin
        run: |
          git clone https://github.com/context-dot-dev/sgrep src && cd src && git checkout --quiet "$REF" && git rev-parse HEAD
      - name: Build
        run: |
          cd src
          cargo build --release
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p ../out
          cp target/release/sgrep "../out/sgrep-$V-x86_64-linux-gnu"
          cp target/x86_64-unknown-linux-musl/release/sgrep "../out/sgrep-$V-x86_64-linux-musl"
          file ../out/*; ../out/sgrep-$V-x86_64-linux-gnu --version
      - name: Model cache (first-use downloads, vendored so containers never fetch them per task)
        # BOTH embedding models: `--model auto` picks potion-code-16M-v2 for code candidates and potion-base-8M for prose-only
        # candidates, so a prose corpus triggers a second download — run one code query and one prose query before packing.
        run: |
          mkdir -p smoke && printf 'def parse_config(path):\n    return load(path)\n' > smoke/a.py
          (cd smoke && ../out/sgrep-$V-x86_64-linux-gnu "load configuration" . >/dev/null)
          mkdir -p prose && printf 'The retry policy waits with exponential backoff and random jitter.\n' > prose/note.txt
          (cd prose && ../out/sgrep-$V-x86_64-linux-gnu "retry backoff jitter" . >/dev/null)
          ls ~/.cache/huggingface/hub | grep -c potion | grep -q 2
          tar czf out/sgrep-model-cache-v2.tgz -C ~/.cache huggingface/hub/models--minishlab--potion-code-16M-v2 huggingface/hub/models--minishlab--potion-base-8M
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "sgrep-$V" out/* --title "sgrep $V" --notes "Built from context-dot-dev/sgrep @ $REF on $(date -u +%F)." --target "${{ github.sha }}" || gh release upload "sgrep-$V" out/* --clobber
  build-macos:
    if: ${{ github.event.inputs.targets != 'linux' }}
    runs-on: macos-14   # arm64; public repo → no billed minutes; uploads onto the existing release (no dependency on the linux job)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pin
        run: |
          REF="${{ github.event.inputs.upstream_ref }}"; [ -n "$REF" ] || REF="$(cat tools/sgrep/PIN)"; echo "REF=$REF" >> "$GITHUB_ENV"
          echo "V=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
      - name: Fetch upstream at the pin
        run: git clone https://github.com/context-dot-dev/sgrep src && cd src && git checkout --quiet "$REF" && git rev-parse HEAD
      - name: Build
        run: |
          cd src && mkdir -p ../out
          if [ "${{ github.event.inputs.targets }}" != "macos-x64" ]; then
            cargo build --release
            cp target/release/sgrep "../out/sgrep-$V-aarch64-darwin"
            ../out/sgrep-$V-aarch64-darwin --version && ../out/sgrep-$V-aarch64-darwin --help | grep -q -- --explain
          fi
          # Intel macOS (2026-11-05: an Intel macOS 11 client): cross-compiled on this arm64 runner, minimum macOS 11.0.
          rustup target add x86_64-apple-darwin
          MACOSX_DEPLOYMENT_TARGET=11.0 cargo build --release --target x86_64-apple-darwin
          cp target/x86_64-apple-darwin/release/sgrep "../out/sgrep-$V-x86_64-darwin"
          file "../out/sgrep-$V-x86_64-darwin" | grep -q x86_64
          otool -l "../out/sgrep-$V-x86_64-darwin" | grep -A4 LC_BUILD_VERSION | grep -E "minos 11\.0" || { echo "::error::x86_64 build does not target macOS 11.0"; exit 1; }
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            /usr/bin/arch -x86_64 ../out/sgrep-$V-x86_64-darwin --version && /usr/bin/arch -x86_64 ../out/sgrep-$V-x86_64-darwin --help | grep -q -- --explain
          else echo "::warning::Rosetta not available on this runner — x86_64 binary built but not executed"; fi
      - name: Checksum + upload (appends to the release the linux job created)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd out
          if [ "${{ github.event.inputs.targets }}" = "macos-x64" ]; then
            # Only the new asset + its own checksum file: the published arm64 binary and SHA256SUMS.darwin (pinned by consumers) stay byte-identical.
            shasum -a 256 sgrep-$V-x86_64-darwin > SHA256SUMS.darwin-x64 && cat SHA256SUMS.darwin-x64
            gh release upload "sgrep-$V" sgrep-$V-x86_64-darwin SHA256SUMS.darwin-x64 --clobber
          else
            shasum -a 256 sgrep-$V-aarch64-darwin sgrep-$V-x86_64-darwin > SHA256SUMS.darwin && cat SHA256SUMS.darwin
            gh release upload "sgrep-$V" sgrep-$V-aarch64-darwin sgrep-$V-x86_64-darwin SHA256SUMS.darwin --clobber
          fi
