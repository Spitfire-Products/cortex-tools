name: build-sgrep
# Manual only. Builds context-dot-dev/sgrep at a pinned ref for x86_64 glibc + static musl (and, in a second job, macOS arm64 —
# the upstream macOS tarball is cut from the v0.3.0 TAG and lacks --explain/--stdin that main gained after it; both report 0.3.0)
# and publishes a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      upstream_ref: { description: "upstream commit or tag (default: tools/sgrep/PIN)", required: false, default: "" }
      version:      { description: "release version, e.g. 0.3.0", required: true, default: "0.3.0" }
      targets:      { description: "linux | macos | both (macos alone leaves the published Linux assets and their pinned checksums untouched)", required: false, default: "both" }
permissions: { contents: write }
jobs:
  build:
    if: ${{ github.event.inputs.targets != 'macos' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pin
        run: |
          REF="${{ github.event.inputs.upstream_ref }}"; [ -n "$REF" ] || REF="$(cat tools/sgrep/PIN)"; echo "REF=$REF" >> "$GITHUB_ENV"
          echo "V=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
      - name: Toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools ripgrep >/dev/null
          rustup target add x86_64-unknown-linux-musl
      - name: Fetch upstream at the pin
        run: |
          git clone https://github.com/context-dot-dev/sgrep src && cd src && git checkout --quiet "$REF" && git rev-parse HEAD
      - name: Build
        run: |
          cd src
          cargo build --release
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p ../out
          cp target/release/sgrep "../out/sgrep-$V-x86_64-linux-gnu"
          cp target/x86_64-unknown-linux-musl/release/sgrep "../out/sgrep-$V-x86_64-linux-musl"
          file ../out/*; ../out/sgrep-$V-x86_64-linux-gnu --version
      - name: Model cache (first-use download, vendored so containers never fetch it per task)
        run: |
          mkdir -p smoke && printf 'def parse_config(path):\n    return load(path)\n' > smoke/a.py
          (cd smoke && ../out/sgrep-$V-x86_64-linux-gnu "load configuration" . >/dev/null)
          tar czf out/sgrep-model-cache-potion-code-16M-v2.tgz -C ~/.cache huggingface
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "sgrep-$V" out/* --title "sgrep $V" --notes "Built from context-dot-dev/sgrep @ $REF on $(date -u +%F)." --target "${{ github.sha }}" || gh release upload "sgrep-$V" out/* --clobber
  build-macos:
    if: ${{ github.event.inputs.targets != 'linux' }}
    runs-on: macos-14   # arm64; public repo → no billed minutes; uploads onto the existing release (no dependency on the linux job)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pin
        run: |
          REF="${{ github.event.inputs.upstream_ref }}"; [ -n "$REF" ] || REF="$(cat tools/sgrep/PIN)"; echo "REF=$REF" >> "$GITHUB_ENV"
          echo "V=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
      - name: Fetch upstream at the pin
        run: git clone https://github.com/context-dot-dev/sgrep src && cd src && git checkout --quiet "$REF" && git rev-parse HEAD
      - name: Build
        run: |
          cd src && cargo build --release && mkdir -p ../out
          cp target/release/sgrep "../out/sgrep-$V-aarch64-darwin"
          ../out/sgrep-$V-aarch64-darwin --version && ../out/sgrep-$V-aarch64-darwin --help | grep -q -- --explain
      - name: Checksum + upload (appends to the release the linux job created)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd out && shasum -a 256 sgrep-$V-aarch64-darwin > SHA256SUMS.darwin && cat SHA256SUMS.darwin
          gh release upload "sgrep-$V" sgrep-$V-aarch64-darwin SHA256SUMS.darwin --clobber
